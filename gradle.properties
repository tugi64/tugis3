# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.
# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html
# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
# Gradle global ayarlar - sade (kapt kald?r?ld?, KSP kullan?l?yor)
# Heap size art?r?ld?: daha h?zl? derleme ve yükleme
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8 -XX:+UseG1GC -XX:MaxMetaspaceSize=1024m

android.useAndroidX=true
# android.enableJetifier=true  # (kapat?ld? - eski support lib bulunmad??? i?in)
android.enableJetifier=false
kotlin.code.style=official
android.nonTransitiveRClass=true

# --- Performans ve Cache Ayarlar? ---
org.gradle.configuration-cache=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.warning.mode=summary

# Kotlin incremental / classpath snapshot
kotlin.incremental=true
kotlin.incremental.useClasspathSnapshot=true
kotlin.daemon.strategy=adaptive

# Kotlin metadata version mismatch'i tolere et (Google Maps libs Kotlin 2.2.0 ile derlenmi?)
# Bu, farkl? Kotlin s?r?mleriyle derlenmi? k?t?phanelerin kullan?lmas?na izin verir

# KSP incremental
ksp.incremental=true
ksp.incremental.intermodule=true

# Dagger / Hilt i?in daha h?zl? init
# dagger.fastInit=enabled

# Not: Crashlytics eklendi, google-services plugin konfig?rasyonu i?in google-services.json gerekecek.
android.suppressUnsupportedCompileSdk=36
